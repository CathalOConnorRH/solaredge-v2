[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiosolaredge-one"
version = "0.3.0"
description = "Async client for the SolarEdge ONE (Monitoring v2) API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "aiosolaredge-one contributors" }]
keywords = ["solaredge", "solar", "monitoring", "home-assistant", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
]
publish = [
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/CathalOConnorRH/solaredge-v2"
Repository = "https://github.com/CathalOConnorRH/solaredge-v2"
Issues = "https://github.com/CathalOConnorRH/solaredge-v2/issues"
Changelog = "https://github.com/CathalOConnorRH/solaredge-v2/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aiosolaredge_one"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
